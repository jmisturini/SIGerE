[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
# E4/E7/E9: erros reais de sintaxe/uso; F: variáveis e imports problemáticos.
select = ["E4", "E7", "E9", "F"]
ignore = [
  # SQLAlchemy: `Coluna == True` em filtros é a forma idiomática de gerar SQL.
  "E712",
  # Estilo legado (statement único com ; e if de uma linha) — não é risco;
  # limpeza estética fica para um PR separado.
  "E701",
  "E702",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv", "examples"]
