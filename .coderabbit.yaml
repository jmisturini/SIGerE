# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Faz o CodeRabbit marcar a review como CHANGES_REQUESTED quando há
# apontamentos acionáveis — é esse estado que o check portao-coderabbit
# (.github/workflows/coderabbit.yml) usa como bloqueio de merge.
# As demais configurações seguem as definidas na web do CodeRabbit.
reviews:
  request_changes_workflow: true
