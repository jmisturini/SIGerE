name: Portao CodeRabbit

# Regra de merge: nenhum PR pode ser mesclado sem a revisão do CodeRabbit
# conferida — mesmo com pytest e Qualidade verdes. O check só fica verde
# quando existe revisão concluída do CodeRabbit PARA O COMMIT ATUAL da PR,
# sem CHANGES_REQUESTED e sem thread de revisão dele em aberto. Se o app do
# CodeRabbit for desativado no repositório, remover ANTES este check da
# proteção de dev e main (check obrigatório sem status novo trava todo
# merge) e só então desativar este workflow.
#
# Eventos: a revisão do bot (objeto de review) dispara pull_request_review.
# O webhook pull_request_review_thread (thread resolvida/reaberta) EXISTE,
# mas o Actions não o oferece como trigger — o workflow não dispara nesses
# casos; reavaliar com o botão Re-run do check. O mesmo vale para rodadas
# do bot que encerram sem gerar objeto de review (incremental, sem
# apontamentos novos): sem evento, o Re-run aplica o fallback do check-run
# do app. O bloqueio complementar recomendado é
# *Require conversation resolution before merging* na proteção da branch
# (docs/guia-continuidade.md, seções 3 e 8).
#
# Para virar bloqueio real, o check "portao-coderabbit" precisa ser
# marcado como *required* em dev e main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: portao-coderabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  portao-coderabbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Valida revisão do CodeRabbit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # 300s em TODOS os eventos: a run disparada por review entra no
          # mesmo grupo de concorrência e cancela a run do push — com
          # espera menor ela poderia falhar antes de o bot terminar. O
          # loop sai cedo quando a revisão já existe; o limite só custa
          # tempo quando ela falta.
          ESPERA: 300
        run: |
          set -euo pipefail

          API="https://api.github.com"
          autenticacao=(-H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")

          # SHA atual da PR: review de commit anterior não vale (a cada push
          # o CodeRabbit precisa revisar de novo).
          HEAD_SHA=$(curl -sSf "${autenticacao[@]}" "$API/repos/$REPO/pulls/$PR" | jq -r '.head.sha')
          echo "PR #$PR (head $HEAD_SHA) — aguardando revisão do CodeRabbit para este commit (até ${ESPERA}s)…"

          revisao=""
          prazo=$(( $(date +%s) + ESPERA ))
          while [ -z "$revisao" ]; do
            # Paginação: acumula todas as páginas antes de escolher a última.
            todas="[]"
            pagina=1
            while :; do
              lote=$(curl -sSf "${autenticacao[@]}" \
                  "$API/repos/$REPO/pulls/$PR/reviews?per_page=100&page=$pagina")
              todas=$(jq -c --argjson t "$todas" '$t + .' <<<"$lote")
              [ "$(jq 'length' <<<"$lote")" -lt 100 ] && break
              pagina=$((pagina + 1))
              if [ "$pagina" -gt 10 ]; then
                echo "::error::Mais de 1000 reviews na PR — valide manualmente (check falhando fechado por segurança)."
                exit 1
              fi
            done
            # Política do portão: a revisão MAIS RECENTE do bot para o commit
            # atual é a decisão vigente — mesma semântica do GitHub para
            # reviews de pessoas. Cada rodada do bot re-analisa o diff
            # completo do PR, então re rodar com @coderabbitai review no
            # mesmo commit reavalia os apontamentos anteriores de verdade.
            revisao=$(jq -c --arg sha "$HEAD_SHA" '[
                .[] | select(
                  (.user.login | ascii_downcase) == "coderabbitai[bot]"
                  and .state != "PENDING"
                  and .commit_id == $sha)]
              | sort_by(.id) | last // empty' <<<"$todas")
            [ -n "$revisao" ] && break
            [ "$(date +%s)" -ge "$prazo" ] && break
            sleep 15
          done

          if [ -z "$revisao" ]; then
            # O bot é incremental: encerrando a rodada sem apontamentos
            # novos, pode NÃO publicar objeto de review para o commit (e
            # @coderabbitai review se recusa a re-revisar). Nesse caso a
            # prova de revisão é o check-run do próprio app para ESTE
            # commit: success = processou até o fim (skipped = pausado,
            # não vale). Achados do bot sempre viram objeto de review
            # (CHANGES_REQUESTED, bloqueado acima quando existe) ou thread
            # (bloqueada abaixo) — nunca desaparecem no fallback.
            # Paginação: check_name=CodeRabbit no servidor + todas as
            # páginas, para o check-run do bot nunca ficar fora de uma
            # primeira página lotada de outros checks.
            processado=0
            pagina=1
            while :; do
              check_bot=$(curl -sSf "${autenticacao[@]}" \
                  "$API/repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=CodeRabbit&per_page=100&page=$pagina")
              processado=$((processado + $(jq '[.check_runs[] | select(
                  (.app.slug // "") == "coderabbitai"
                  and .name == "CodeRabbit"
                  and .status == "completed"
                  and .conclusion == "success")] | length' <<<"$check_bot")))
              [ "$(jq '.check_runs | length' <<<"$check_bot")" -lt 100 ] && break
              pagina=$((pagina + 1))
              if [ "$pagina" -gt 10 ]; then
                echo "::error::Mais de 1000 check-runs no commit — valide manualmente (check falhando fechado por segurança)."
                exit 1
              fi
            done
            if [ "$processado" -eq 0 ]; then
              echo "::error::Nenhuma revisão concluída do CodeRabbit para o commit $HEAD_SHA após ${ESPERA}s. Comente @coderabbitai review; se a rodada encerrar sem objeto de revisão (ou threads forem resolvidas), re rode este check no botão Re-run."
              exit 1
            fi
            echo "Revisão do CodeRabbit processou $HEAD_SHA sem gerar objeto (sem apontamentos novos)."
          else
            estado=$(jq -r '.state' <<<"$revisao")
            echo "Última revisão do CodeRabbit para $HEAD_SHA: $estado"

            if [ "$estado" = "CHANGES_REQUESTED" ]; then
              echo "::error::O CodeRabbit pediu alterações. Resolva os apontamentos (os de fora do diff ficam no CORPO da review) e re rode a revisão com @coderabbitai review antes de mesclar."
              exit 1
            fi
          fi

          # Threads de review do CodeRabbit ainda em aberto (não resolvidas
          # e vigentes — as ultrapassadas por commits novos são isOutdated).
          payload=$(jq -n \
              --arg owner "${REPO%%/*}" --arg name "${REPO#*/}" --argjson n "$PR" \
              '{query: "query($owner:String!,$name:String!,$n:Int!){repository(owner:$owner,name:$name){pullRequest(number:$n){reviewThreads(first:100){nodes{isResolved isOutdated comments(first:1){nodes{author{login}}}} pageInfo{hasNextPage}}}}}",
                variables: {owner: $owner, name: $name, n: $n}}')
          grafo=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" "$API/graphql" -d "$payload")

          if jq -e '.errors' <<<"$grafo" >/dev/null; then
            echo "::error::Falha na consulta GraphQL: $(jq -r '.errors[0].message // "erro desconhecido"' <<<"$grafo")"
            exit 1
          fi

          if jq -e '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$grafo" | grep -q true; then
            echo "::error::A PR tem mais de 100 threads de revisão — valide manualmente antes de mesclar (falhando fechado por segurança)."
            exit 1
          fi

          pendentes=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false
                  and .isOutdated == false
                  and ((.comments.nodes[0].author.login // "") | ascii_downcase) == "coderabbitai[bot]")]
              | length' <<<"$grafo")

          if [ "$pendentes" -gt 0 ]; then
            echo "::error::$pendentes thread(s) de revisão do CodeRabbit sem resolução. Responda e resolva as conversas (ou comente @coderabbitai resolve) e re rode este check antes de mesclar."
            exit 1
          fi

          echo "Revisão do CodeRabbit conferida: sem apontamentos pendentes. Liberado para mesclar."
