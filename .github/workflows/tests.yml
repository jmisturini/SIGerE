name: Testes

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Pushes sucessivos ao mesmo ref empilham runs (o do PostgreSQL orquestra um
# serviço e é o mais longo). Cancela SÓ no contexto de pull_request. Em
# main/dev: o run EM ANDAMENTO nunca é cancelado; um run PENDENTE pode ser
# substituído pelo push mais novo (padrão do GitHub, "latest wins" — o
# estado final é o que fica testado, e os commits do push substituído
# estão contidos no mais novo). O github.ref separa o contexto de
# pull_request (refs/pull/N/merge) do push de branch (refs/heads/...).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# O job só precisa ler o repositório — sem isso, o GITHUB_TOKEN recebe as
# permissões padrão do repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # Mesmo contrato do job abaixo: um pytest pendurado não pode reter o
    # runner até o limite global da conta.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Não deixa o token do checkout gravado em .git/config enquanto
          # pip/pytest executam código de terceiros.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instala dependências
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Roda a suíte de testes
        run: python -m pytest -q

  # Integração com o PostgreSQL de produção (#239): FOR UPDATE, advisory
  # locks e o CAS das rotas de reserva só são reais lá — o SQLite do job
  # acima os ignora. Escopo restrito à suíte de concorrência
  # (tests/test_teacher_locks.py), que é a que exercita esses caminhos; o
  # escritor concorrente roda em OUTRO processo conectado ao mesmo banco
  # via TEST_DATABASE_URL. A suíte se adapta ao backend por branch
  # condicional (self.motor_postgres, no setUp e nos testes) e os 2 testes
  # cujas janelas só existem no SQLite pulam aqui com o motivo no log.
  testes-postgres:
    runs-on: ubuntu-latest
    # Serviço PostgreSQL + testes de concorrência com travas: um travamento
    # (lock nunca liberado, serviço sem health) não pode reter o runner até
    # o limite global.
    timeout-minutes: 15
    services:
      postgres:
        # Patch pinnado (16.16, a versão que a tag 16 resolvia quando o job
        # entrou): atualização de imagem não pode mudar o comportamento do
        # banco por baixo dos testes de travas — OCR #245.
        image: postgres:16.16
        env:
          # Trust auth (sem senha): o banco é EFÊMERO e só acessível na
          # localhost do próprio runner — não há segredo para proteger nem
          # credencial em texto plano no repo. POSTGRES_DB cria o banco já
          # pronto para a TEST_DATABASE_URL do passo abaixo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sigere_testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Não deixa o token do checkout gravado em .git/config enquanto
          # pip/pytest executam código de terceiros.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instala dependências
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Roda os testes de concorrência no PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/sigere_testes
        run: python -m pytest -q tests/test_teacher_locks.py
