{% extends 'base.html' %}
{% block title %}Schedule Calendar{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-3 p-md-4">
        <div id='calendar'></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- FullCalendar CDN -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek', // Default to Week view
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'timeGridDay,timeGridWeek,dayGridMonth' // Day, Week, Month buttons
        },
        height: '80vh', // Make calendar tall
        events: '{{ url_for("schedule.events") }}', // Fetch events from our API
        eventTimeFormat: { // Format time as 24h HH:mm
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        },
        slotMinTime: '07:00:00', // Calendar starts at 7 AM
        slotMaxTime: '23:00:00', // Calendar ends at 11 PM
        nowIndicator: true, // Show a red line for current time
        buttonText: {
            today: 'Today',
            day: 'Day',
            week: 'Week',
            month: 'Month'
        },
        eventClick: function(info) {
            // Prevent default navigation, open in same tab
            info.jsEvent.preventDefault();
            if (info.event.url) {
                window.location.href = info.event.url;
            }
        }
    });
    
    calendar.render();
    
    // Fix for Dark Mode initialization
    function applyCalendarTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const bg = isDark ? '#1e293b' : '#ffffff';
        const text = isDark ? '#f8fafc' : '#1e293b';
        const border = isDark ? '#334155' : '#e2e8f0';
        const muted = isDark ? '#94a3b8' : '#64748b';
        
        const root = document.documentElement;
        root.style.setProperty('--fc-page-bg-color', bg);
        root.style.setProperty('--fc-neutral-bg-color', isDark ? '#1e293b' : '#f8fafc');
        root.style.setProperty('--fc-border-color', border);
        root.style.setProperty('--fc-today-bg-color', isDark ? 'rgba(59, 130, 246, 0.1)' : 'rgba(37, 99, 235, 0.05)');
        
        // Force re-render of calendar to apply styles
        calendar.setOption('dayHeaderFormat', { weekday: 'short', month: 'numeric', day: 'numeric' });
        setTimeout(() => calendar.updateSize(), 50);
    }

    applyCalendarTheme();

    // Listen for theme toggle button clicks
    document.getElementById('theme-toggle').addEventListener('click', function() {
        setTimeout(applyCalendarTheme, 50);
    });
});
</script>

<!-- Custom CSS to integrate FullCalendar with our CSS Variables -->
<style>
    :root {
        --fc-page-bg-color: #ffffff;
        --fc-neutral-bg-color: #f8fafc;
        --fc-border-color: #e2e8f0;
        --fc-today-bg-color: rgba(37, 99, 235, 0.05);
        --fc-text: #1e293b;
        --fc-muted: #64748b;
    }
    
    .fc {
        color: var(--fc-text);
    }
    
    .fc .fc-toolbar-title {
        font-size: 1.5rem;
        font-weight: 700;
    }
    
    .fc .fc-button {
        background-color: var(--card-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 8px !important;
        font-weight: 500;
        text-transform: capitalize;
    }
    
    .fc .fc-button:hover {
        background-color: var(--table-bg);
    }
    
    .fc .fc-button-primary:not(:disabled).fc-button-active {
        background-color: var(--primary-color);
        color: #fff;
        border-color: var(--primary-color);
    }
    
    .fc .fc-button:disabled {
        opacity: 0.5;
        background-color: var(--card-bg);
        color: var(--text-muted);
    }
    
    .fc .fc-col-header-cell-cushion, 
    .fc .fc-daygrid-day-number {
        color: var(--text-main);
        text-decoration: none;
        font-weight: 600;
    }
    
    .fc .fc-time {
        color: var(--text-muted);
    }
    
    .fc .fc-event {
        border: none;
        padding: 2px 4px;
        border-radius: 4px;
        cursor: pointer;
    }
    
    .fc .fc-day-today {
        background-color: var(--fc-today-bg-color) !important;
    }
    
    .fc-theme-standard td, 
    .fc-theme-standard th {
        border-color: var(--border-color);
    }
    
    .fc-scrollgrid, .fc-scrollgrid-section > td {
        border-color: var(--border-color) !important;
        background-color: var(--card-bg);
    }
    
    .fc .fc-timegrid-slot-lane {
        background-color: var(--card-bg);
    }
</style>
{% endblock %}
