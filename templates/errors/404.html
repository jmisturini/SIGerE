{% extends 'base.html' %}
{% block title %}Não Encontrado{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card text-center border-0">
            <div class="card-body p-5">
                <div class="feature-icon bg-primary-subtle text-primary mb-4 mx-auto">
                    <i class="bi bi-compass"></i>
                </div>
                <h1 class="display-4 fw-bold mb-2">404</h1>
                <h4 class="mb-3">Página Não Encontrada</h4>
                <p class="text-muted mb-4">A página que você procura não existe ou foi movida. Verifique o endereço digitado ou retorne para o painel principal.</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Ir para o Painel
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .feature-icon {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
    }
</style>
{% endblock %}
