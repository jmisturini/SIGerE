{% extends 'base.html' %}
{% block title %}Acesso Negado{% endblock %}

        <div class="card text-center border-0">
            <div class="card-body p-5">
                <div class="feature-icon bg-danger-subtle text-danger mb-4 mx-auto">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h1 class="display-4 fw-bold mb-2">403</h1>

                <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Ir para o Painel
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .feature-icon {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
    }
</style>
